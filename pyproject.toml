[project]
name = "rag-learning-python"
version = "0.1.0"
description = "A small Python RAG learning project with ingestion, retrieval, and answer generation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=14.0.0",
    "typer>=0.20.0",
]

[project.optional-dependencies]
local = [
    "chromadb>=1.1.0",
    "sentence-transformers>=5.0.0",
]
llm = [
    "openai>=2.0.0",
    "python-dotenv>=1.0.0",
]
pdf = [
    "pypdf>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.14.0",
]

[project.scripts]
rag = "rag_learning.cli:app"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_learning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
